<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141619"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Primitive Time"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><title>Primitive Time</title><style>
:root{color-scheme:dark;--bg:#141619;--card:#21252a;--card2:#282e34;--ink:#f1f2f4;--muted:#a3aab3;--line:#3a4047;--accent:#d8dde2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #e1e5e9;outline-offset:2px}.shell{max-width:650px;margin:0 auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))}.top{padding:26px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-size:10px;font-weight:800}.brand{font-size:25px;font-weight:900;letter-spacing:-1px}.sub{color:var(--muted);font-size:12px;margin-top:4px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{background:#343b43;border-radius:50px;padding:7px 11px;font-size:12px;color:var(--ink)}.muted{color:var(--muted)}.small{font-size:12px}.section-title{font-size:16px;font-weight:800;margin:23px 0 12px}.profile-group{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.profile{border:1px solid var(--line);padding:14px 5px;border-radius:14px;background:var(--card);color:var(--ink);font-weight:700}.profile.selected{border-color:#f4f4f4;background:#363e46}.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--ink);margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.muscle{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;text-align:left;color:var(--ink);min-height:121px}.muscle .symbol{font-size:24px;color:#c2cad3}.muscle .name{font-size:15px;font-weight:800;margin-top:12px}.muscle .count{font-size:12px;color:var(--muted);margin-top:3px}.item{width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:15px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.item small{display:block;margin-top:5px;color:var(--muted)}.back{background:none;border:0;color:var(--muted);padding:5px 0;margin:7px 0 3px}.marks{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mark{padding:15px;background:var(--card2);border-radius:12px}.mark .value{font-size:25px;font-weight:850;margin-top:9px;letter-spacing:-.8px}.mark small{color:var(--muted)}label{display:block;font-weight:700;font-size:13px;margin:13px 0 6px}.form-input{width:100%;padding:13px;background:var(--card2);border:1px solid #535a62;border-radius:11px;color:var(--ink)}.action{background:var(--accent);color:#16191d;border:none;padding:14px 16px;border-radius:12px;font-weight:800}.secondary{background:var(--card2);color:var(--ink);border:1px solid var(--line);padding:12px;border-radius:12px}.full{width:100%}.entry{border-bottom:1px solid var(--line);padding:12px 0}.entry:last-child{border:0}.danger{color:#ffb1ae}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#1d2025;border-top:1px solid var(--line);padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:5}.tabs-inner{max-width:650px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tab{background:transparent;border:0;color:var(--muted);padding:6px 5px}.tab.active{color:var(--ink);font-weight:800}.tab span{display:block;font-size:20px}.empty{padding:20px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#d6dce2;color:#151719;border-radius:12px;padding:12px 17px;z-index:10;max-width:90%;white-space:nowrap;font-size:13px}.stat{font-size:24px;font-weight:900}.inline-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.inline-actions button{flex:1}.note{font-size:12px;color:var(--muted);line-height:1.5}h2{font-size:21px}h3{font-size:16px}input[type=file]{display:none}@media(min-width:650px){.shell{padding-left:28px;padding-right:28px}}
</style></head><body><main class="shell" id="root"></main><nav class="tabs"><div class="tabs-inner"><button class="tab" id="nav-home" data-nav="home"><span>▦</span>Ejercicios</button><button class="tab" id="nav-stats" data-nav="stats"><span>▥</span>Progreso</button><button class="tab" id="nav-settings" data-nav="settings"><span>⚙</span>Ajustes</button></div></nav><div id="toast" class="toast" hidden></div><script>
'use strict';
const CATALOG={"Pecho": ["Press declinado en máquina", "Peck Deck (aperturas)", "Press inclinado con barra", "Press inclinado con mancuernas"], "Espalda": ["Jalón al pecho", "Remo en barra T", "Remo cerrado", "Máquina pullover", "Máquina de dorsales", "Remo en máquina", "Peso muerto", "Peck Deck invertido (deltoides posteriores)"], "Hombros": ["Press militar con mancuernas", "Press militar en máquina", "Elevaciones laterales en polea", "Elevaciones laterales en máquina", "Elevaciones laterales con mancuernas"], "Bíceps": ["Curl predicador en máquina", "Curl predicador con peso libre", "Curl de bíceps con mancuernas", "Curl de bíceps en polea", "Curl martillo con mancuernas", "Curl martillo en polea", "Curl bayesiano en máquina", "Curl bayesiano en polea"], "Tríceps": ["Extensión de tríceps en polea", "Extensión Katana unilateral", "Extensión Katana bilateral", "Extensión Copa unilateral", "Extensión Copa bilateral"], "Piernas": ["Sentadilla Hack", "Sentadilla en Smith", "Sentadilla libre", "Prensa 45°", "Extensión de cuádriceps en máquina", "Curl de isquiotibiales en máquina", "Abductores en máquina", "Aductores en máquina", "Hip thrust en máquina", "Elevación de gemelos en máquina"]};
const PROFILES=['Walter','Nacho','Bastian'];
const ICONS={"Pecho": "▣", "Espalda": "≋", "Hombros": "◇", "Bíceps": "↗", "Tríceps": "↘", "Piernas": "▥"};
const KEY='primitive-time-v1';
let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(_){db=null}
if(!db||typeof db!=='object'||!db.records)db={profile:'Walter',records:{Walter:{},Nacho:{},Bastian:{}}};
for(const p of PROFILES)if(!db.records[p]||typeof db.records[p]!=='object')db.records[p]={};
if(!PROFILES.includes(db.profile))db.profile='Walter';
let view={tab:'home',section:null,exercise:null,search:''};
const root=document.getElementById('root');
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('No se pudo guardar en este dispositivo. Exporta un respaldo y revisa el almacenamiento disponible.')}}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,2500)}
const exercises=Object.entries(CATALOG).flatMap(([category,names])=>names.map((name,index)=>({id:category+'-'+index,name,category})));
const getExercise=id=>exercises.find(x=>x.id===id);
const records=id=>(db.records[db.profile][id]||[]);
const best=(id,type)=>records(id).filter(r=>r.type===type).reduce((a,b)=>!a||b.kg>a.kg?b:a,null);
const fmt=n=>Number(n).toLocaleString('es-CL',{maximumFractionDigits:2});
function header(title,sub){return `<header class="top"><div><div class="eyebrow">Primitive Time</div><div class="brand">${escapeHtml(title)}</div><div class="sub">${escapeHtml(sub)}</div></div><div class="pill">${escapeHtml(db.profile)} ▾</div></header>`}
function profileSelect(){return `<div class="profile-group">${PROFILES.map(p=>`<button class="profile ${p===db.profile?'selected':''}" data-profile="${p}">${p}</button>`).join('')}</div>`}
function home(){const q=view.search.toLowerCase().trim();let html=header('STRENGTH TRACKER','Tus marcas, tu progreso.')+`<div class="section-title">Selecciona tu perfil</div>${profileSelect()}<div class="section-title">Biblioteca de ejercicios</div><input id="search" class="search" placeholder="Buscar entre 40 ejercicios..." value="${escapeHtml(view.search)}" aria-label="Buscar ejercicios">`;
if(q){const found=exercises.filter(x=>(x.name+' '+x.category).toLowerCase().includes(q));html+=`<div class="section-title">Resultados (${found.length})</div>`+exerciseList(found);return html}
html+='<div class="grid">'+Object.keys(CATALOG).map(category=>`<button class="muscle" data-section="${escapeHtml(category)}"><div class="symbol">${ICONS[category]}</div><div class="name">${escapeHtml(category.toUpperCase())}</div><div class="count">${CATALOG[category].length} ejercicios →</div></button>`).join('')+'</div>';
return html}
function exerciseList(items){if(!items.length)return '<div class="empty">Sin resultados.</div>';return items.map(x=>{const pr=best(x.id,'1rm'),eight=best(x.id,'8rm');return `<button class="item" data-exercise="${escapeHtml(x.id)}"><div><strong>${escapeHtml(x.name)}</strong><small>${escapeHtml(x.category)} · 1RM: ${pr?fmt(pr.kg)+' kg':'—'} · 8RM: ${eight?fmt(eight.kg)+' kg':'—'}</small></div><span>›</span></button>`}).join('')}
function sectionScreen(){return header(view.section,`${CATALOG[view.section].length} ejercicios`)+`<button class="back" data-back="home">← Grupos musculares</button>`+exerciseList(exercises.filter(x=>x.category===view.section))}
function exerciseScreen(){let x=getExercise(view.exercise);if(!x)return home();const pr=best(x.id,'1rm'),eight=best(x.id,'8rm'),history=[...records(x.id)].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);return header('REGISTRO DE FUERZA',db.profile)+`<button class="back" data-back="section">← ${escapeHtml(x.category)}</button><h2>${escapeHtml(x.name)}</h2><div class="marks"><div class="mark"><small>🏆 PR · 1 repetición</small><div class="value">${pr?fmt(pr.kg)+' kg':'—'}</div><small>${pr?escapeHtml(pr.date):'Sin registros'}</small></div><div class="mark"><small>▥ Máximo · 8 repeticiones</small><div class="value">${eight?fmt(eight.kg)+' kg':'—'}</div><small>${eight?escapeHtml(eight.date):'Sin registros'}</small></div></div><div class="card"><h3>Agregar una marca</h3><form id="mark-form"><label for="mark-type">Tipo de marca</label><select class="form-input" id="mark-type"><option value="1rm">1RM · 1 repetición</option><option value="8rm">8RM · 8 repeticiones</option></select><label for="mark-kg">Peso (kg)</label><input required class="form-input" id="mark-kg" type="number" min="0.01" max="2000" step="0.01" inputmode="decimal" placeholder="Ej.: 80"><label for="mark-date">Fecha</label><input required class="form-input" id="mark-date" type="date" value="${new Date().toLocaleDateString('en-CA')}"><div style="height:14px"></div><button class="action full" type="submit">Guardar marca</button></form><p class="note">Registra solo pesos realmente levantados. Para mancuernas o ejercicios unilaterales, anota el peso por mancuerna o brazo. Para máquinas, la carga indicada por el equipo.</p></div><div class="section-title">Historial (${history.length})</div>${history.length?history.map(r=>`<div class="entry row"><div><strong>${fmt(r.kg)} kg</strong> · ${r.type==='1rm'?'1 repetición':'8 repeticiones'}<div class="small muted">${escapeHtml(r.date)}</div></div><button class="secondary danger" data-delete="${escapeHtml(x.id)}" data-id="${r.created}" aria-label="Eliminar registro">Eliminar</button></div>`).join(''):'<div class="empty">Aún no hay marcas. Guarda tu primera marca.</div>'}`}
function stats(){let total=0,withMarks=0;const ranking=[];for(const x of exercises){const rs=records(x.id);total+=rs.length;if(rs.length)withMarks++;const a=best(x.id,'1rm'),b=best(x.id,'8rm');if(a||b)ranking.push({x,a,b})}return header('TU PROGRESO','Resumen individual de fuerza')+profileSelect()+`<div class="grid"><div class="card"><div class="stat">${total}</div><div class="muted small">Marcas registradas</div></div><div class="card"><div class="stat">${withMarks}/40</div><div class="muted small">Ejercicios con marcas</div></div></div><div class="section-title">Mejores marcas</div>${ranking.length?ranking.map(({x,a,b})=>`<button class="item" data-exercise="${x.id}"><div><strong>${escapeHtml(x.name)}</strong><small>1RM: ${a?fmt(a.kg)+' kg':'—'} · 8RM: ${b?fmt(b.kg)+' kg':'—'}</small></div><span>›</span></button>`).join(''):'<div class="empty">Comienza registrando una marca para ver aquí tu progreso.</div>'}`}
function settings(){return header('AJUSTES','Privacidad y respaldos')+`<div class="section-title">Perfiles</div>${profileSelect()}<div class="card"><h3>Respaldo de los tres perfiles</h3><p class="note">Los datos se guardan solo en este dispositivo y no se sincronizan automáticamente. Exporta periódicamente un archivo de respaldo. El archivo incluye los registros de los tres perfiles.</p><div class="inline-actions"><button class="action" id="export">Exportar JSON</button><button class="secondary" id="import-trigger">Importar JSON</button></div><input type="file" accept="application/json,.json" id="import-file"></div><div class="card"><h3>Cómo instalar</h3><p class="note">Android: abre este sitio con Chrome y selecciona «Instalar aplicación» o «Agregar a pantalla principal». iPhone: abre con Safari, pulsa Compartir y «Agregar a pantalla de inicio».</p></div><div class="card"><h3>Acerca de</h3><p class="note">Primitive Time 1.0 · 40 ejercicios · 6 grupos musculares · Walter, Nacho y Bastian. Las marcas 1RM y 8RM son reales y se registran por separado. No se calculan estimaciones.</p></div>`}
function render(){root.innerHTML=view.exercise?exerciseScreen():view.section?sectionScreen():view.tab==='stats'?stats():view.tab==='settings'?settings():home();for(const tab of ['home','stats','settings'])document.getElementById('nav-'+tab).classList.toggle('active',view.tab===tab);const search=document.getElementById('search');if(search){search.addEventListener('input',e=>{view.search=e.target.value;const pos=e.target.selectionStart;render();document.getElementById('search').focus();document.getElementById('search').setSelectionRange(pos,pos)})}}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.profile){db.profile=b.dataset.profile;save();render()}else if(b.dataset.section){view.section=b.dataset.section;view.exercise=null;render();scrollTo(0,0)}else if(b.dataset.exercise){const x=getExercise(b.dataset.exercise);if(!x)return;view.exercise=x.id;view.section=x.category;render();scrollTo(0,0)}else if(b.dataset.back){if(b.dataset.back==='section'){view.exercise=null}else{view.section=null;view.exercise=null}render()}else if(b.dataset.delete){if(!confirm('¿Eliminar esta marca del historial?'))return;const id=b.dataset.delete;db.records[db.profile][id]=records(id).filter(r=>String(r.created)!==b.dataset.id);save();render();toast('Marca eliminada')}else if(b.id==='export'){const blob=new Blob([JSON.stringify({app:'primitive-time',version:1,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='primitive-time-respaldo-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}else if(b.id==='import-trigger'){document.getElementById('import-file').click()}});
root.addEventListener('submit',e=>{if(e.target.id!=='mark-form')return;e.preventDefault();const kg=Number(document.getElementById('mark-kg').value),type=document.getElementById('mark-type').value,date=document.getElementById('mark-date').value;if(!Number.isFinite(kg)||kg<=0||kg>2000||!['1rm','8rm'].includes(type)||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date)){alert('Ingresa una marca válida.');return}const id=view.exercise;(db.records[db.profile][id]??=[]).push({kg,type,date,created:Date.now()+Math.random()});save();render();toast('Marca guardada')});
root.addEventListener('change',async e=>{if(e.target.id!=='import-file')return;const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());const d=obj.data;if(obj.app!=='primitive-time'||!d||!d.records||!PROFILES.every(p=>d.records[p]&&typeof d.records[p]==='object'))throw Error('Formato incompatible');for(const p of PROFILES)for(const [id,arr] of Object.entries(d.records[p])){if(!getExercise(id)||!Array.isArray(arr)||arr.some(r=>!['1rm','8rm'].includes(r.type)||typeof r.kg!=='number'||!Number.isFinite(r.kg)||r.kg<=0||!/^\d{4}-\d{2}-\d{2}$/.test(r.date)))throw Error('Datos inválidos')}if(!confirm('Importar reemplazará TODOS los registros actuales de este dispositivo. ¿Continuar?'))return;db={profile:PROFILES.includes(d.profile)?d.profile:'Walter',records:d.records};save();view={tab:'settings',section:null,exercise:null,search:''};render();toast('Respaldo importado')}catch(err){alert('No se pudo importar: '+err.message)}});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(!b)return;view={tab:b.dataset.nav,section:null,exercise:null,search:''};render();scrollTo(0,0)});
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
